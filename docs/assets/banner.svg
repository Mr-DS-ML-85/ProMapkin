<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Promapkin</title>
  <desc id="d">Promapkin: an evidence-aware map of your codebase for coding agents and developers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14130f"/>
      <stop offset="1" stop-color="#26231b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2c072"/>
      <stop offset="1" stop-color="#b8892b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>

  <!-- evidence graph: solid = observed, dashed = inferred -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M760 92 L868 150" stroke="#e2c072" stroke-opacity=".85"/>
    <path d="M868 150 L990 104" stroke="#e2c072" stroke-opacity=".85"/>
    <path d="M868 150 L900 262" stroke="#e2c072" stroke-opacity=".85"/>
    <path d="M900 262 L1046 236" stroke="#e2c072" stroke-opacity=".85"/>
    <path d="M990 104 L1046 236" stroke="#8fb3d9" stroke-opacity=".8" stroke-dasharray="7 7"/>
    <path d="M760 92 L742 230" stroke="#8fb3d9" stroke-opacity=".8" stroke-dasharray="7 7"/>
    <path d="M742 230 L900 262" stroke="#e2c072" stroke-opacity=".85"/>
    <path d="M1046 236 L1110 140" stroke="#c9785a" stroke-opacity=".8" stroke-dasharray="3 6"/>
  </g>
  <g>
    <circle cx="760" cy="92" r="13" fill="#e2c072"/>
    <circle cx="868" cy="150" r="20" fill="#e2c072"/>
    <circle cx="990" cy="104" r="11" fill="#8fb3d9"/>
    <circle cx="900" cy="262" r="15" fill="#e2c072"/>
    <circle cx="1046" cy="236" r="12" fill="#c9785a"/>
    <circle cx="742" cy="230" r="9" fill="#8fb3d9"/>
    <circle cx="1110" cy="140" r="8" fill="#c9785a"/>
    <circle cx="868" cy="150" r="31" fill="none" stroke="#e2c072" stroke-opacity=".35" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d8d1c0" fill-opacity=".75">
    <text x="886" y="128">calls · ast</text>
    <text x="1004" y="178">dispatches · inferred</text>
    <text x="760" y="286">routes_to · ast</text>
  </g>

  <!-- wordmark -->
  <text x="72" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800"
        letter-spacing="-2" fill="#f4efe2">Pro<tspan fill="url(#gold)">Mapkin</tspan></text>
  <text x="76" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#cfc7b4">
    Evidence-aware codebase intelligence for agents and developers
  </text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e2c072">
    <rect x="76" y="250" width="104" height="34" rx="17" fill="#e2c072" fill-opacity=".12" stroke="#e2c072" stroke-opacity=".4"/>
    <text x="128" y="272" text-anchor="middle">CLI</text>
    <rect x="192" y="250" width="104" height="34" rx="17" fill="#e2c072" fill-opacity=".12" stroke="#e2c072" stroke-opacity=".4"/>
    <text x="244" y="272" text-anchor="middle">MCP</text>
    <rect x="308" y="250" width="132" height="34" rx="17" fill="#e2c072" fill-opacity=".12" stroke="#e2c072" stroke-opacity=".4"/>
    <text x="374" y="272" text-anchor="middle">--llm</text>
    <rect x="452" y="250" width="160" height="34" rx="17" fill="#e2c072" fill-opacity=".12" stroke="#e2c072" stroke-opacity=".4"/>
    <text x="532" y="272" text-anchor="middle">13 languages</text>
  </g>
</svg>
