apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: search
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/search:1.0
          command: ["python", "-m", "searchapp.cli"]
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: search-secrets
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: search
spec:
  selector:
    app: search
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: search
spec:
  rules:
    - host: search.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: search-secrets
  namespace: search
stringData:
  API_TOKEN: x
