[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promapkin"
version = "0.1.0"
description = "Agentic codebase intelligence and knowledge-transfer engine: evidence-backed blueprints, a semantic code graph, and shareable agent handoffs over CLI and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
promapkin = "promapkin.cli:main"

[tool.setuptools.packages.find]
include = ["promapkin*"]

[project.optional-dependencies]
ml = ["fastembed>=0.3", "numpy>=1.24"]
dl = ["sentence-transformers>=2.2", "numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
