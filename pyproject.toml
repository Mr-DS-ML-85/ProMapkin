[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promapkin"
version = "0.2.0"
description = "Agentic codebase intelligence and knowledge-transfer engine: evidence-backed blueprints, a semantic code graph, and shareable agent handoffs over CLI and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
promapkin = "promapkin.cli:main"

[tool.setuptools.packages.find]
include = ["promapkin*"]

[project.optional-dependencies]
ml = ["fastembed>=0.3", "numpy>=1.24"]
dl = ["sentence-transformers>=2.2", "numpy>=1.24"]
llm = ["anthropic>=0.70", "openai>=1.40"]
parsers = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
assets = ["pypdf>=4"]
yaml = ["pyyaml>=6"]
all = ["fastembed>=0.3", "numpy>=1.24", "anthropic>=0.70", "openai>=1.40", "tree-sitter>=0.23",
       "tree-sitter-language-pack>=0.7", "pypdf>=4", "pyyaml>=6"]

[tool.setuptools.package-data]
promapkin = ["extract/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
