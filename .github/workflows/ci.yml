name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["core", "all"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.extras == 'all'
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "all" ]; then
            pip install -e ".[llm,parsers]" numpy
            mkdir -p "$HOME/.cache/promapkin/toolchain/node"
            (cd "$HOME/.cache/promapkin/toolchain/node" && echo '{"private":true}' > package.json && npm install --silent typescript@5)
          else
            pip install -e .
          fi
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke test the CLI on itself
        run: |
          python -m promapkin --root . init
          PROMAPKIN_ML_MODE=never python -m promapkin --root . scan
          python -m promapkin --root . blueprint generate
          python -m promapkin --root . graph hubs --limit 5
          python -m promapkin --root . mcp inspect
